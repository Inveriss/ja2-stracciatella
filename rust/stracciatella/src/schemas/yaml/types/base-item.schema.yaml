type: object
title: Base Item
description: The basic properties for all items in the game
properties:
  minDropProgress:
    title: Minimum progress for enemy drops
    description: |
      An enemy leaves this item behind (killed, disarmed, as an attachment of a dropped gun)
      only when the game's highest progress is at least this value, 0-100; 0 or left out
      means always (docs/enemy-drop-progress-plan.md). Off with game.json
      enemy_drop_progress_limits false.
    type: integer
    minimum: 0
    maximum: 100
  attachmentFamily:
    title: Weapon attachment family
    description: The family in weapon-attachment-families.json (docs/weapon-attachments-plan.md)
    type: string
  attachmentLevel:
    title: Weapon attachment level
    description: Quality level 1-3 of the attachment within its family
    type: integer
    minimum: 1
    maximum: 3
  attachmentEffects:
    title: Weapon attachment effects
    description: |
      Numeric effects of the attachment, summed over all attachments on a weapon. A value
      left out is the default of the attachment's family (the original game's value for the
      original families), else none.
    type: object
    properties:
      rangeBonus:
        title: Range (a bonus scales with the condition, a penalty doesn't)
        type: integer
      aimBonus:
        title: To hit, like the laser scope (penalty below 50% condition)
        type: integer
      aimedShotBonus:
        title: Percent of the sight range less per aim AP beyond the scope range, like the sniper scope
        type: integer
      proneBonus:
        title: Percent of the prone aim bonus added, like the bipod (200)
        type: integer
      attackVolumePercent:
        title: Percent of the gun's noise left at full condition, like the silencer (0)
        type: integer
        minimum: 0
        maximum: 100
      apPerShotChange:
        title: AP per shot and burst, like the spring and bolt upgrade (-1)
        type: integer
      burstShotsBonus:
        title: Shots per burst
        type: integer
    additionalProperties: false
  bAttachment:
    title: Is an attachment?
    type: boolean
  bBigGunList:
    title: Big gun list?
    type: boolean
  bDamageable:
    title: Is damageable?
    type: boolean
  bDefaultUndroppable:
    title: Undroppable by default?
    type: boolean
  bElectronic:
    title: Is electronic?
    type: boolean
  bHiddenAddon:
    title: Is hidden addon?
    type: boolean
  bInseparable:
    title: Is inseparable?
    type: boolean
  bMetal:
    title: Is metal?
    type: boolean
  bNotBuyable:
    title: Not buyable?
    type: boolean
  bNotEditor:
    title: Dont show in editor?
    type: boolean
  bReliability:
    title: Reliability
    $ref: types/int8.schema.yaml
  bRepairable:
    title: Is repairable?
    type: boolean
  bRepairEase:
    title: Repair ease
    $ref: types/int8.schema.yaml
  bSinks:
    title: Sinks in water?
    type: boolean
  bShowStatus:
    title: Show status?
    type: boolean
  bTwoHanded:
    title: Is two handed?
    type: boolean
  bUnaerodynamic:
    title: Is unaerodynamic?
    type: boolean
  bWaterDamages:
    title: Damaged by water?
    type: boolean
  description:
    title: Description
    type: string
  internalName:
    title: Internal name
    $ref: types/id.schema.yaml
  inventoryGraphics:
    title: Inventory Graphics
    description: Graphics that are used in the inventory interface for this item
    type: object
    properties:
      small:
        title: Small
        description: Small graphics. Used e.g. in strategic & tactical inventory
        $ref: types/graphic.schema.yaml
      big:
        title: Big
        description: Big graphics. Used e.g. in item detail view
        $ref: types/graphic.schema.yaml
    required:
      - small
      - big
  itemIndex:
    title: Item Index
    $ref: types/uint16.schema.yaml
  name:
    title: Name
    type: string
  shortName:
    title: Short name
    type: string
  tileGraphic:
    title: Tile graphic index
    description: Graphic that is used when the item is shown on the tactical map
    $ref: types/tileset-tile-index.schema.yaml
  ubCoolness:
    title: Coolness
    $ref: types/uint8.schema.yaml
  ubPerPocket:
    title: Per pocket
    description: |
      Defines item size and amount per inventory slot

      - Items with value `0` are big and only fit into big pockets
      - Items with value a value above `0` are small. The value determines how many stack into one small pocket
    $ref: types/uint8.schema.yaml
  ubWeight:
    title: Weight
    $ref: types/uint8.schema.yaml
  usPrice:
    title: Price
    $ref: types/uint16.schema.yaml
required:
  - bReliability
  - bRepairEase
  - internalName
  - inventoryGraphics
  - itemIndex
  - tileGraphic
  - ubCoolness
  - ubPerPocket
  - ubWeight
  - usPrice
