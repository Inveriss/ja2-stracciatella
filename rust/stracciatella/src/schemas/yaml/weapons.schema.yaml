$schema: http://json-schema.org/schema#
type: array
title: Weapons
items:
  allOf:
    - title: Base Item
      $ref: types/base-item.schema.yaml
    - type: object
      title: Weapon
      properties:
        internalType:
          title: Internal type
          type: string
          enum:
          - PUNCH
          - PISTOL
          - M_PISTOL
          - SMG
          - RIFLE
          - SN_RIFLE
          - ASRIFLE
          - SHOTGUN
          - LMG
          - BLADE
          - THROWINGBLADE
          - THROWN
          - LAUNCHER
          - MONSTSPIT
          - PUNCHWEAPON
          - LAW
          - CANNON
          - NOWEAPON
        attachmentsAllow:
          title: Attachment families this weapon takes
          description: Regardless of the family rules (docs/weapon-attachments-plan.md)
          type: array
          items:
            type: string
        attachmentsDeny:
          title: Attachment families this weapon refuses
          description: Even when the family rule takes the weapon
          type: array
          items:
            type: string
        sound:
          title: Shot sound
          description: Path to sound that is played when a single shot is fired.
          $ref: types/resource-path.schema.yaml
        burstSound:
          title: Burst sound
          description: |
            Path to sounds that are played as burst sounds for this calibre.

            %d will replaced with the amount of bullets left in the gun.
          $ref: types/resource-path.schema.yaml
        silencedSound:
          title: Silenced shot sound
          description: Path to sound that is played when a single shot is fired and gun is silenced somehow.
          $ref: types/resource-path.schema.yaml
        silencedBurstSound:
          title: Silenced burst sound
          description: |
            Path to sounds that are played as burst sounds for this calibre when the gun is silenced somehow.

            %d will replaced with the amount of bullets left in the gun.
          $ref: types/resource-path.schema.yaml
        rateOfFire:
          title: Rate of fire
          $ref: types/int32.schema.yaml
        usRange:
          title: Range
          $ref: types/uint16.schema.yaml
        calibre:
          title: Calibre
          $ref: types/id.schema.yaml
        ubReadyTime:
          title: Ready time
          $ref: types/uint8.schema.yaml
        ubBulletSpeed:
          title: Bullet speed
          $ref: types/uint8.schema.yaml
        ubImpact:
          title: Impact
          $ref: types/uint8.schema.yaml
        ubDeadliness:
          title: Deadliness
          $ref: types/uint8.schema.yaml
        ubMagSize:
          title: Magazine size
          $ref: types/uint8.schema.yaml
        ubAttackVolume:
          title: Attack volume
          $ref: types/uint8.schema.yaml
        ubHitVolume:
          title: Hit volume
          $ref: types/uint8.schema.yaml
        attachment_Silencer:
          title: Attachment silencer?
          type: boolean
        attachment_LaserScope:
          title: Attachment laser scope?
          type: boolean
        attachment_SpringAndBoltUpgrade:
          title: Attachment spring and bolt?
          type: boolean
        attachment_GunBarrelExtender:
          title: Attachment gun barrel extender?
          type: boolean
        standardReplacement:
          title: Standard replacement
          $ref: types/id.schema.yaml
        ubAPCostPerSingleShot:
          title: AP cost of a single shot or stab
          description: A direct AP value, the same for everyone, -1 with a Spring and Bolt Upgrade. Also the cost of a hit with a `PUNCHWEAPON` (brass knuckles, crowbar); a bare fist costs 4 AP.
          $ref: types/uint8.schema.yaml
        ubAPCostPerThrow:
          title: AP cost of a throw
          description: A direct AP value for every thrower, only for `THROWN` items (rocks). Missing = 11 AP, with a warning.
          $ref: types/uint8.schema.yaml
        ubAPCostPerShortBurst:
          title: AP cost of the short burst
          description: The full cost of the burst as a direct AP value, not a surcharge on top of `ubAPCostPerSingleShot`, -1 with a Spring and Bolt Upgrade. null or missing = `ubAPCostPerSingleShot` + 4.
          anyOf:
            - $ref: types/uint8.schema.yaml
            - type: 'null'
        ubAPCostPerLongBurst:
          title: AP cost of the long burst
          description: See `ubAPCostPerShortBurst`.
          anyOf:
            - $ref: types/uint8.schema.yaml
            - type: 'null'
        ubAPCostPerFullBurst:
          title: AP cost of the full burst
          description: See `ubAPCostPerShortBurst`.
          anyOf:
            - $ref: types/uint8.schema.yaml
            - type: 'null'
        ubShotsPerShortBurst:
          title: Shots per short burst
          description: Default 3 for weapons that can burst, 0 = no short burst.
          $ref: types/uint8.schema.yaml
        ubShotsPerLongBurst:
          title: Shots per long burst
          description: Default 6 for weapons that can burst, 0 = no long burst.
          $ref: types/uint8.schema.yaml
        ubShotsPerFullBurst:
          title: Shots per full burst
          description: The factory magazine size (default `ubMagSize`), a larger magazine doesn't make the full burst longer. 0 = no full burst.
          $ref: types/uint8.schema.yaml
        ubShotsPerBurst:
          title: Shots per burst (deprecated)
          description: Used only when the burst fields above are missing, any value above 0 gives their defaults.
          $ref: types/uint8.schema.yaml
        ubBurstPenalty:
          title: Burst penalty
          $ref: types/uint8.schema.yaml
        attachment_SniperScope:
          title: Attachment sniper scope?
          type: boolean
        attachment_UnderGLauncher:
          title: Attachment under grenade launcher?
          type: boolean
        attachment_Bipod:
          title: Attachment bipod?
          type: boolean
        attachment_Duckbill:
          title: Attachment duckbill?
          type: boolean
        usSmokeEffect:
          title: Smoke effect
          $ref: types/uint16.schema.yaml
      required:
        - internalType
        - rateOfFire
